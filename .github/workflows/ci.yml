name: CI

on:
  push:
    branches: [main]
    tags: ["v[0-9]*"]
    paths:
      - "src/**"
      - "tests/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - "pyproject.toml"
      - "*.pyi"
      - "py.typed"
      - "LICENSE*"
      - ".cargo/**"
      - "rust-toolchain*"
      - "*rustfmt.toml"
      - "*clippy.toml"
      - ".github/actions/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "src/**"
      - "tests/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - "pyproject.toml"
      - "*.pyi"
      - "py.typed"
      - "LICENSE*"
      - ".cargo/**"
      - "rust-toolchain*"
      - "*rustfmt.toml"
      - "*clippy.toml"
      - ".github/actions/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:
    inputs:
      build_wheels:
        description: "Build the full platform wheel matrix and sdist"
        type: boolean
        default: false
      publish:
        description: "Build all artifacts and publish to PyPI"
        type: boolean
        default: false

# Replace obsolete PR/main checks, without interrupting release publishing.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}

permissions:
  contents: read

jobs:
  test:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cargo fmt
        run: cargo fmt --all -- --check
      - name: Cargo clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Cargo test
        run: cargo test --all --release

  smoke:
    name: Wheel smoke (${{ matrix.python }})
    needs: [test]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "pypy3.12-v8.0.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Build native wheel
        uses: PyO3/maturin-action@v1
        with:
          container: "off"
          args: --release --locked --out dist --interpreter python
      - name: Test installed wheel
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python -m unittest discover -s tests

  linux:
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && (inputs.build_wheels || inputs.publish))
    runs-on: ubuntu-latest
    needs: [test]
    strategy:
      matrix:
        target: [x86_64, x86, aarch64, armv7, s390x, ppc64le]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --find-interpreter
          sccache: "true"
          manylinux: auto
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist

  musllinux:
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && (inputs.build_wheels || inputs.publish))
    runs-on: ubuntu-latest
    needs: [test]
    strategy:
      matrix:
        target: [x86_64, x86, aarch64, armv7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --find-interpreter
          sccache: "true"
          manylinux: musllinux_1_2
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-musllinux-${{ matrix.target }}
          path: dist

  windows:
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && (inputs.build_wheels || inputs.publish))
    runs-on: windows-latest
    needs: [test]
    strategy:
      matrix:
        target: [x64, x86]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          architecture: ${{ matrix.target }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --find-interpreter
          sccache: "true"
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-${{ matrix.target }}
          path: dist

  macos:
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && (inputs.build_wheels || inputs.publish))
    needs: [test]
    strategy:
      matrix:
        include:
          - target: x86_64
            runner: macos-14
          - target: aarch64
            runner: macos-14
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --find-interpreter
          sccache: "true"
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist

  pypy:
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && (inputs.build_wheels || inputs.publish))
    name: PyPy ${{ matrix.python-version }} wheel on ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    needs: [test]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        name: [linux-x86_64, linux-aarch64, windows-x64, macos-aarch64]
        include:
          - name: linux-x86_64
            runner: ubuntu-latest
            platform: linux
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
            platform: linux
          - name: windows-x64
            runner: windows-latest
            platform: windows
          - name: macos-aarch64
            runner: macos-latest
            platform: macos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Pin the release so PyPy 3.12 is downloaded even before runner caches update.
          python-version: pypy${{ matrix.python-version }}-v8.0.0
      - name: Install zig (for Linux manylinux builds)
        if: matrix.platform == 'linux'
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.11.0
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          # The manylinux images do not yet contain PyPy 3.12, so build with the
          # interpreter installed above. Zig supplies the portable Linux ABI.
          container: "off"
          args: >-
            --release --locked --out dist --interpreter python
            ${{ matrix.platform == 'linux' && '--zig --compatibility manylinux_2_28' || '' }}
      - name: Verify wheel tag
        shell: bash
        run: |
          shopt -s nullglob
          wheels=(dist/*.whl)
          if [ ${#wheels[@]} -ne 1 ]; then
            echo "Expected exactly one PyPy wheel, found ${#wheels[@]}" >&2
            exit 1
          fi
          expected_tag="pp${{ matrix.python-version }}"
          expected_tag="${expected_tag/./}"
          name="$(basename "${wheels[0]}")"
          if [[ "$name" != *"-${expected_tag}-"* ]]; then
            echo "Expected a ${expected_tag} wheel, got: $name" >&2
            exit 1
          fi
      - name: Smoke-test wheel
        shell: bash
        run: |
          python -m pip install --force-reinstall dist/*.whl
          cd "$RUNNER_TEMP"
          python - <<'PY'
          import platform, sys
          import turboxml

          assert platform.python_implementation() == "PyPy"
          assert f"{sys.version_info.major}.{sys.version_info.minor}" == "${{ matrix.python-version }}"
          node = turboxml.read_string('<a x="1 &amp; 2"><b>t</b><![CDATA[<c>]]><d/></a>', "a")
          assert node.attrs == {"x": "1 & 2"}
          assert node.children[0].text == "t" and node.text == "<c>"
          reread = turboxml.read_string(turboxml.write_string(node), "a")
          assert reread.to_dict() == node.to_dict()
          PY
      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheels-pypy${{ matrix.python-version }}-${{ matrix.name }}
          path: dist
          if-no-files-found: error

  sdist:
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && (inputs.build_wheels || inputs.publish))
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  release:
    name: Release
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.publish)
    needs: [smoke, linux, musllinux, windows, macos, pypy, sdist]
    permissions:
      attestations: write  # for artifact attestation
      contents: read
      id-token: write  # for trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
